name: Publish to npm

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # never cancel an in-flight publish

permissions:
  contents: read
  id-token: write  # required for npm provenance

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # registry-url MUST be repeated here (not just in the test job).
      # setup-node writes an .npmrc that maps NODE_AUTH_TOKEN to the registry auth.
      # Without this, NODE_AUTH_TOKEN is ignored and npm publish fails with 401.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
