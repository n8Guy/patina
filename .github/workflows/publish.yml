name: Publish to npm

# Triggers on every push to main (i.e. after a PR merge).
# The publish step is a no-op when the version in package.json is already on NPM,
# so merges without a version bump are safe.
#
# Required secrets:
#   NPM_TOKEN — an NPM "Automation" token with publish rights.
#               Add it at: Settings → Secrets and variables → Actions → New repository secret.
#
# Note: no app token needed here. version-bump.yml merges via the GitHub App, which fires
# a real push event on main and triggers this workflow. Checkout uses GITHUB_TOKEN (read-only).

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # never cancel an in-flight publish

permissions:
  contents: write  # required to create GitHub Releases
  id-token: write  # required for npm provenance

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      # registry-url MUST be set here (not just in the test job).
      # setup-node writes an .npmrc that maps NODE_AUTH_TOKEN to the registry auth.
      # Without this, NODE_AUTH_TOKEN is ignored and npm publish fails with 401.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.x
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run build

      - name: Check if version is already published
        id: version_check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "my-patina@${VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "Version ${VERSION} is already on NPM — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${VERSION} is new — will publish."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package contents
        if: steps.version_check.outputs.skip == 'false'
        run: npm pack --dry-run

      - name: Publish to NPM
        if: steps.version_check.outputs.skip == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.version_check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes
